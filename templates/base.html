<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Merico 代码质量分析平台{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    {% block head %}{% endblock %}
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span>🔍</span> Merico Analysis
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">概览</a>
                <a href="/duplicate-functions" class="nav-link">重复函数</a>
                <a href="/uncommented-functions" class="nav-link">未注释函数</a>
                <a href="/api/status" class="nav-link">API 状态</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container animate-fade-in">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer style="text-align: center; padding: 40px; color: rgba(255,255,255,0.7); font-size: 0.9rem;">
        <p>© 2025 Merico Code Quality Analysis System</p>
    </footer>

    <!-- Chat Widget -->
    <div id="chatToggleBtn" class="chat-toggle-btn">💬</div>
    <div id="chatWidget" class="chat-widget">
        <div class="chat-header">
            <div class="chat-title">
                <span>🤖</span> Merico AI 助手
            </div>
            <div class="chat-controls">
                <span id="chatCloseBtn" style="font-size: 1.2rem;">×</span>
            </div>
        </div>
        <div id="chatMessages" class="chat-messages">
            <div class="message assistant">
                你好！我是智能代码分析助手。<br>你可以通过对话让我帮你运行分析或生成报告。
            </div>
        </div>
        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <textarea id="chatInput" class="chat-input" placeholder="输入指令... (例如: 生成全部周报)" rows="1"></textarea>
                <button id="sendBtn" class="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/task-manager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
