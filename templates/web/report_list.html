{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">{{ icon }} {{ title }}</h1>
    <a href="/" class="btn btn-secondary">← 返回首页</a>
</div>

<div class="glass-panel" style="padding: 20px;">
    {% if reports %}
    <div class="table-responsive">
        <table class="custom-table">
            <thead>
                <tr>
                    <th>报告名称</th>
                    <th>生成时间</th>
                    <th>文件大小</th>
                    <th style="text-align: right;">操作</th>
                </tr>
            </thead>
            <tbody>
                {% for report in reports %}
                <tr>
                    <td>
                        <div style="font-weight: 600; color: var(--text-main);">{{ report.name }}</div>
                    </td>
                    <td style="color: var(--text-secondary);">{{ report.mtime }}</td>
                    <td><span class="badge badge-info">{{ report.size }}</span></td>
                    <td style="text-align: right;">
                        <a href="{{ report.url }}" class="btn btn-primary"
                            style="padding: 6px 12px; font-size: 0.85rem;" target="_blank">
                            查看报告
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <div class="empty-state">
        <div class="empty-icon">📭</div>
        <p>暂无报告，请在首页运行分析。</p>
        <a href="/" class="btn btn-primary mt-4">去运行</a>
    </div>
    {% endif %}
</div>
{% endblock %}
